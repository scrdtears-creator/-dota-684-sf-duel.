<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101015">
<title>DOTA 6.84 — SF Duel</title>
<style>
:root{--gold:#d9b46a;--red:#b63b32;--panel:#19191f;--text:#e9e3d6}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d0e12;color:var(--text);font-family:Georgia,"Times New Roman",serif;touch-action:none}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font:inherit;color:var(--text);border:1px solid #776343;background:linear-gradient(#302a22,#171519);padding:12px 18px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase}
button:active{transform:translateY(1px);filter:brightness(1.3)}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 36%,#44231e 0,#1b1519 38%,#090a0e 80%);z-index:5}
.menu-card{width:min(92vw,520px);padding:28px 24px;border:1px solid #806844;box-shadow:0 0 0 5px #171319,0 18px 80px #000;background:linear-gradient(145deg,#211d1d,#111116);text-align:center}
.kicker{font-size:12px;letter-spacing:.35em;color:#c3a56c}.logo{font-size:clamp(34px,8vw,56px);line-height:.95;color:#e0c38a;text-shadow:0 3px #5e2c20,0 0 22px #a3482c;margin:12px 0 8px}.subtitle{color:#aaa08d;font-size:14px;margin-bottom:26px}.menu-card button{width:100%;margin:6px 0}.note{font:12px/1.5 Arial,sans-serif;color:#817c78;margin-top:14px}
#game{display:none;position:absolute;inset:0;background:#10150f}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;font-family:Arial,sans-serif}
.top{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:min(92%,500px);display:flex;gap:8px;justify-content:center;align-items:center}
.hpbox{background:#17181dcc;border:1px solid #756448;padding:7px 12px;min-width:112px;text-align:center;font-size:12px}
.bar{height:7px;background:#4b2020;margin-top:5px;border:1px solid #111}.fill{height:100%;background:#a83b35;width:100%}.blue .fill{background:#b89a5a}
#status{color:#ead5a5;text-shadow:0 1px 3px #000;font-size:13px;text-align:center;min-width:110px}
#back{position:absolute;top:10px;left:10px;pointer-events:auto;padding:8px 10px;font-size:11px}
#hint{position:absolute;top:66px;left:50%;transform:translateX(-50%);font:12px Arial,sans-serif;color:#e6d9ba;background:#1010109c;padding:6px 9px;white-space:nowrap}
.controls{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 18px;pointer-events:none}
.pad{width:118px;height:118px;border-radius:50%;border:1px solid #c5b17b80;background:#111b;position:relative;pointer-events:auto;touch-action:none}
.knob{position:absolute;left:35px;top:35px;width:46px;height:46px;border-radius:50%;background:#b8a16c88;border:1px solid #ead6a1}
.actions{display:flex;gap:8px;align-items:end;pointer-events:auto}
.act{width:58px;height:58px;border-radius:50%;padding:0;font:bold 12px Arial,sans-serif;background:radial-gradient(#463b32,#171419);border-color:#c3a46c;position:relative}
.act small{display:block;font-size:9px;color:#c8b78f;margin-top:3px}
#attack{width:64px;height:64px;border-color:#b95043;background:radial-gradient(#70332c,#211417)}
#desktophelp{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:11px Arial,sans-serif;color:#c9c0ac;background:#101010aa;padding:5px 8px;white-space:nowrap}
#end{display:none;position:absolute;inset:0;background:#09090ddd;z-index:4;align-items:center;justify-content:center;text-align:center}
#end .panel{border:1px solid #927548;background:#171519;padding:26px;width:min(90vw,380px)}
@media(min-width:800px){.controls{padding:0 36px}.pad{width:140px;height:140px}.knob{left:43px;top:43px}.act{width:68px;height:68px}}
</style>
</head>
<body>
<div id="menu">
  <div class="menu-card">
    <div class="kicker">CLASSIC ERA • 6.84 INSPIRED</div>
    <div class="logo">DOTA<br>DUEL</div>
    <div class="subtitle">SHADOW FIEND • MID ONLY</div>
    <button id="start" type="button" onclick="window.startDuel && window.startDuel()">Начать дуэль 1 на 1</button>
    <button id="how" type="button" onclick="window.showHow && window.showHow()">Как играть</button>
    <div class="note" id="menunote">Прототип: локальный бой против бота. Не официальный продукт Valve.</div>
  </div>
</div>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <button id="back">← Меню</button>
    <div class="top">
      <div class="hpbox"><span>ТЫ • NEVERMORE</span><div class="bar"><div id="php" class="fill"></div></div><span id="ptext">100 / 100</span></div>
      <div id="status">0 — 0</div>
      <div class="hpbox blue"><span>БОТ • NEVERMORE</span><div class="bar"><div id="ehp" class="fill"></div></div><span id="etext">100 / 100</span></div>
    </div>
    <div id="hint">Уничтожь вражеского SF 3 раза</div>
    <div class="controls">
      <div id="pad" class="pad"><div id="knob" class="knob"></div></div>
      <div class="actions">
        <button id="attack" class="act">ATK<small>атака</small></button>
        <button id="q" class="act">Q<small>ближний</small></button>
        <button id="w" class="act">W<small>средний</small></button>
        <button id="e" class="act">E<small>дальний</small></button>
      </div>
    </div>
    <div id="desktophelp">ПК: WASD / стрелки — движение • Space — атака • Q W E — Shadowraze</div>
  </div>
</div>
<div id="end"><div class="panel"><h2 id="endtitle">ПОБЕДА</h2><p id="endtext"></p><button id="again">Ещё раз</button><button id="endmenu">В меню</button></div></div>
<script>
(() => {
const menu=document.getElementById('menu'), game=document.getElementById('game'), canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1, running=false, last=0, scoreP=0,scoreE=0,shots=[],particles=[],keys={},move={x:0,y:0},attackHeld=false,botThink=0;
const arena={};
let p,e;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);arena.x=W*.08;arena.y=H*.13;arena.w=W*.84;arena.h=H*.74;}
window.addEventListener('resize',resize); resize();
function hero(x,y,player){return {x,y,r:16,hp:100,max:100,player,cd:0,hit:0,face:player?1:-1,respawn:0}}
function reset(){scoreP=scoreE=0;shots=[];particles=[];p=hero(W*.28,H*.52,true);e=hero(W*.72,H*.48,false);updateHUD();}
function start(){menu.style.display='none';game.style.display='block';$('end').style.display='none';resize();reset();running=true;last=performance.now();requestAnimationFrame(loop)}
window.startDuel = start;
window.showHow = () => {$('menunote').textContent='Двигайся стиком. ATK атакует рядом, Q/W/E — три Shadowraze на разной дистанции. Победи бота 3 раза. На ПК: WASD + Space + Q/W/E.'};
function back(){running=false;game.style.display='none';$('end').style.display='none';menu.style.display='flex'}
$('start').onclick=start;$('back').onclick=back;$('endmenu').onclick=back;$('again').onclick=start;
$('how').onclick=window.showHow;
function updateHUD(){$('php').style.width=(p.hp/p.max*100)+'%';$('ehp').style.width=(e.hp/e.max*100)+'%';$('ptext').textContent=Math.ceil(p.hp)+' / 100';$('etext').textContent=Math.ceil(e.hp)+' / 100';$('status').textContent=scoreP+' — '+scoreE;}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=30+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.25+Math.random()*.45,color})}}
function hit(target,dmg){if(target.respawn>0)return;target.hp-=dmg;target.hit=.15;burst(target.x,target.y,'#e3a05b',5);if(target.hp<=0){if(target.player)scoreE++;else scoreP++;let wasP=target.player;burst(target.x,target.y,wasP?'#b83d35':'#d9b46a',30);target.respawn=1.25;target.hp=0;updateHUD();if(scoreP>=3||scoreE>=3){running=false;$('endtitle').textContent=scoreP>=3?'ПОБЕДА!':'ПОРАЖЕНИЕ';$('endtext').textContent=`Счёт ${scoreP} — ${scoreE}. ${scoreP>=3?'Ты выиграл дуэль на миде.':'Бот оказался сильнее. Реванш?'}`;$('end').style.display='flex';}}updateHUD()}
function cast(who,kind){if(!running||who.respawn>0||who.cd>0)return;who.cd=kind===0?.65:1.15;let dist=[72,132,195][kind], dir=who.player?1:-1;let sx=who.x+dir*dist, sy=who.y;shots.push({x:sx,y:sy,life:.28,r:[28,31,34][kind],dmg:[17,20,24][kind],owner:who.player?'p':'e',color:who.player?'#dc563d':'#e0bd6a'});burst(sx,sy,who.player?'#e55a38':'#d9b76a',10)}
function attack(who,target){if(who.respawn>0||who.cd>0)return;who.cd=.48;let dx=target.x-who.x,dy=target.y-who.y;if(Math.hypot(dx,dy)<62){hit(target,8);burst((who.x+target.x)/2,(who.y+target.y)/2,'#f3d6a1',4)}}
function clampHero(h){h.x=Math.max(arena.x+22,Math.min(arena.x+arena.w-22,h.x));h.y=Math.max(arena.y+22,Math.min(arena.y+arena.h-22,h.y))}
function loop(now){if(!running)return;let dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){
 for(const h of [p,e]){h.cd=Math.max(0,h.cd-dt);h.hit=Math.max(0,h.hit-dt);if(h.respawn>0){h.respawn-=dt;if(h.respawn<=0){h.hp=100;h.x=h.player?W*.28:W*.72;h.y=H*(h.player?.52:.48);}}}
 if(p.respawn<=0){p.x+=move.x*190*dt;p.y+=move.y*190*dt;clampHero(p)}
 // bot: move toward player, keep range, fire razes and attack
 botThink-=dt;
 if(e.respawn<=0&&p.respawn<=0){let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;let desired=d>115?1:(d<82?-1:0);e.x+=dx/d*desired*118*dt;e.y+=dy/d*desired*118*dt;clampHero(e);e.face=dx>0?1:-1;if(botThink<=0){botThink=.45+Math.random()*.4;if(d<72)attack(e,p);else if(d<220)cast(e,d<100?0:d<155?1:2)}}
 if(attackHeld)attack(p,e);
 for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.life-=dt;if(s.life<=0){let target=s.owner==='p'?e:p;if(target.respawn<=0&&Math.hypot(target.x-s.x,target.y-s.y)<s.r+target.r)hit(target,s.dmg);shots.splice(i,1)}}
 for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.96;q.vy*=.96;if(q.life<=0)particles.splice(i,1)}
}
function draw(){
 ctx.clearRect(0,0,W,H);
 // old-school green battlefield
 let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#263b28');g.addColorStop(.5,'#1b3024');g.addColorStop(1,'#17251d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // arena boundary / lane
 ctx.fillStyle='#394431';ctx.fillRect(arena.x,arena.y,arena.w,arena.h);
 ctx.strokeStyle='#61704a';ctx.lineWidth=2;ctx.strokeRect(arena.x,arena.y,arena.w,arena.h);
 ctx.fillStyle='#4b4a37';ctx.fillRect(arena.x, H*.43, arena.w, H*.14);
 ctx.fillStyle='#5b5942';ctx.fillRect(arena.x, H*.48, arena.w, H*.04);
 // river
 ctx.fillStyle='#244d50';ctx.fillRect(arena.x, H*.47, arena.w, H*.06);
 ctx.strokeStyle='#477276';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(arena.x,H*.47);ctx.lineTo(arena.x+arena.w,H*.47);ctx.moveTo(arena.x,H*.53);ctx.lineTo(arena.x+arena.w,H*.53);ctx.stroke();
 // decorative trees, ruins
 for(let i=0;i<34;i++){let x=arena.x+((i*97+41)%Math.max(1,arena.w)),y=arena.y+((i*67+19)%Math.max(1,arena.h));if(y>H*.42&&y<H*.58)continue;ctx.fillStyle='#111b16';ctx.beginPath();ctx.arc(x+3,y+4,8,0,Math.PI*2);ctx.fill();ctx.fillStyle=i%2?'#2c5034':'#365b39';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5c5944';ctx.fillRect(x-2,y+5,4,6)}
 // bases and towers
 function tower(x,y,color){ctx.fillStyle='#141612';ctx.beginPath();ctx.ellipse(x,y+10,18,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-17);ctx.lineTo(x+12,y+8);ctx.lineTo(x-12,y+8);ctx.closePath();ctx.fill();ctx.strokeStyle='#c2a46b';ctx.stroke()}
 tower(arena.x+28,H*.5,'#963f38');tower(arena.x+arena.w-28,H*.5,'#b29a60');
 // shots
 for(const s of shots){ctx.save();ctx.globalAlpha=Math.min(1,s.life*4);ctx.fillStyle=s.color;ctx.shadowColor=s.color;ctx.shadowBlur=18;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(.7+s.life),0,Math.PI*2);ctx.fill();ctx.restore()}
 drawHero(p);drawHero(e);
 for(const q of particles){ctx.globalAlpha=Math.max(0,q.life*2);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,2+q.life*3,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
}
function drawHero(h){
 if(h.respawn>0){ctx.fillStyle='#c6b184';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText('RESPAWN '+Math.ceil(h.respawn),h.x,h.y);return}
 ctx.save();ctx.translate(h.x,h.y);ctx.fillStyle='#080b09';ctx.beginPath();ctx.ellipse(2,10,17,9,0,0,Math.PI*2);ctx.fill();
 // shadow fiend stylized silhouette
 ctx.fillStyle=h.player?'#a9362e':'#bda05c';ctx.shadowColor=h.player?'#f0442e':'#e6bd68';ctx.shadowBlur=h.hit?24:8;
 ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(13,-8);ctx.lineTo(12,7);ctx.lineTo(0,15);ctx.lineTo(-12,7);ctx.lineTo(-13,-8);ctx.closePath();ctx.fill();
 ctx.fillStyle='#181016';ctx.beginPath();ctx.moveTo(-12,-7);ctx.lineTo(-20,-17);ctx.lineTo(-9,-12);ctx.moveTo(12,-7);ctx.lineTo(20,-17);ctx.lineTo(9,-12);ctx.fill();
 ctx.fillStyle='#f3d99a';ctx.fillRect(-7,-5,4,3);ctx.fillRect(3,-5,4,3);
 ctx.restore();ctx.shadowBlur=0;
 // tiny healthbar
 ctx.fillStyle='#251818';ctx.fillRect(h.x-18,h.y-29,36,4);ctx.fillStyle=h.player?'#ad3e35':'#c5a65d';ctx.fillRect(h.x-18,h.y-29,36*h.hp/h.max,4);
}
const pad=$('pad'),knob=$('knob');let padPointer=null;
function setPad(ev){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=ev.clientX-cx,dy=ev.clientY-cy,lim=r.width*.32,l=Math.hypot(dx,dy)||1;if(l>lim){dx=dx/l*lim;dy=dy/l*lim}move={x:dx/lim,y:dy/lim};knob.style.transform=`translate(${dx}px,${dy}px)`}
pad.addEventListener('pointerdown',e=>{padPointer=e.pointerId;pad.setPointerCapture(e.pointerId);setPad(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===padPointer)setPad(e)});function clearPad(e){if(e.pointerId===padPointer){padPointer=null;move={x:0,y:0};knob.style.transform='translate(0,0)'}}pad.addEventListener('pointerup',clearPad);pad.addEventListener('pointercancel',clearPad);
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attackHeld=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('attack').addEventListener(ev,()=>attackHeld=false));
$('q').onclick=()=>cast(p,0);$('w').onclick=()=>cast(p,1);$('e').onclick=()=>cast(p,2);
window.addEventListener('keydown',ev=>{keys[ev.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(ev.key.toLowerCase()))ev.preventDefault();if(ev.repeat)return;if(ev.key.toLowerCase()==='q')cast(p,0);if(ev.key.toLowerCase()==='w')cast(p,1);if(ev.key.toLowerCase()==='e')cast(p,2);if(ev.code==='Space')attackHeld=true});
window.addEventListener('keyup',ev=>{keys[ev.key.toLowerCase()]=false;if(ev.code==='Space')attackHeld=false});
const oldUpdate=update;
update=function(dt){let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(x||y){let l=Math.hypot(x,y);move={x:x/l,y:y/l}}else if(!padPointer)move={x:0,y:0};oldUpdate(dt)}
})();
</script>
</body>
</html>
